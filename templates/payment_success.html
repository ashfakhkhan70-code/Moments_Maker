<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Payment Successful | MomentsMaker</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
  background:
    radial-gradient(circle at 15% 20%, #c8f7ff 0%, transparent 45%),
    radial-gradient(circle at 85% 25%, #b98cff 0%, transparent 45%),
    linear-gradient(135deg,#e6fbff,#8ee7f3,#3b82f6,#a855f7);
}

.card{
  background:#fff;
  padding:40px 36px;
  border-radius:26px;
  text-align:center;
  box-shadow:0 35px 80px rgba(15,23,42,.25);
  max-width:420px;
}

.icon{
  font-size:70px;
  color:#16a34a;
  margin-bottom:16px;
}

h1{
  font-size:1.8rem;
  margin-bottom:10px;
  color:#0f172a;
}

p{
  color:#475569;
  font-size:.95rem;
  margin-bottom:26px;
}

.btn{
  display:inline-block;
  padding:14px 36px;
  border-radius:999px;
  background:linear-gradient(135deg,#16a34a,#15803d);
  color:#fff;
  text-decoration:none;
  font-weight:600;
  box-shadow:0 18px 40px rgba(22,163,74,.45);
}
</style>
</head>

<body>

<div class="card">
  <div class="icon">✅</div>
  <h1>Payment Successful</h1>
  <p>
    Thank you! Your remaining payment has been received successfully.
    Our team will take care of everything from here.
  </p>
  
</div>

</body>
</html>
